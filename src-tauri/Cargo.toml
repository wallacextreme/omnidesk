[package]
name = "omnidesk"
version = "1.0.0"
description = "OmniDesk - Ultra-low latency Remote Desktop Application"
authors = ["OmniDesk Team"]
edition = "2021"

[lib]
name = "omnidesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
