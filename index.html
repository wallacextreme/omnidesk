<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniDesk - Ultra-Low Latency Remote Desktop</title>
    <meta name="description" content="OmniDesk - Acesso Remoto P2P de Ultra-Baixa Latência, Zero-Trust e Criptografia Ponta a Ponta" />
    <meta name="theme-color" content="#06b6d4" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#090d16] text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200 overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(event) {
        var root = document.getElementById('root');
        if (root && (!root.firstElementChild || root.innerText.trim() === '')) {
          root.innerHTML = '<div style="max-width:560px;margin:50px auto;padding:24px;background:#1e293b;border:1px solid #ef4444;border-radius:16px;color:#f8fafc;font-family:sans-serif;box-shadow:0 20px 40px rgba(0,0,0,0.5);">' +
            '<div style="font-size:32px;margin-bottom:12px;">🖥️ ⚠️</div>' +
            '<h2 style="color:#f87171;margin:0 0 8px 0;font-size:18px;">Diagnóstico de Inicialização (Windows 7 / Chrome 109)</h2>' +
            '<p style="color:#94a3b8;font-size:13px;line-height:1.5;">O navegador encontrou um erro ao inicializar os módulos:</p>' +
            '<pre style="background:#0f172a;padding:12px;border-radius:8px;color:#fca5a5;font-size:11px;overflow:auto;margin:12px 0;">' + (event.message || 'Erro de execução') + '</pre>' +
            '<p style="color:#cbd5e1;font-size:12px;line-height:1.5;"><strong>Dica para Windows 7:</strong> Abra o OmniDesk pelo IP da sua rede local (ex: <code>http://192.168.1.138:5173</code>) para contornar restrições de certificados legados e Mixed Content.</p>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
